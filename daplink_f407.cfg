# ============================================
# DAPLink + STM32F407 调试配置文件
# ============================================

# 1. 指定调试器接口为 CMSIS-DAP (DAPLink)
source [find interface/cmsis-dap.cfg]

# 2. 选择 SWD 两线调试模式
transport select swd

# 3. 设置 SWD 通信速率 (F407 支持较高速度，2000kHz 没问题)
adapter speed 4000

# 4. 指定目标芯片为 STM32F4 系列
source [find target/stm32f4x.cfg]

# ============================================
# 以下为可选配置，建议加上
# ============================================


# 6. 连接后自动复位并暂停，方便调试
# init; reset halt